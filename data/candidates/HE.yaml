tier_rationale: |
  Bucket A, Archetype A1 (sovereign-quasi-statutory anchor via Hawaii
  Act 258 + PUC rate authority) + G (regulator-forced sector-of-one
  recap by liability framework). Triangulation 2.5/3 (Leg 3 partial
  pending insider activity verification). The single most distinctive
  feature: **Condition 7 has already fired** (April 10, 2026 first
  installment cleared). This is the only Tier 1 name where the
  framework's main dated catalyst is in the past tense.

  Implication: the question shifts from "will the catalyst fire?" to
  "is the partial re-rate (€2 → ~$15 ≈ 62% above Sept 2024 equity
  buyers' entry) fully discounting the operational re-rate that the
  catalyst enables?" The waterfall says no — base case 1.80× from $15
  to ~$27; bull 3.00× to ~$45 on full ROE normalisation.

  EV/DD = 1.80/(1-0.6) = 4.5× — one of the cleanest left tails in the
  basket. Position-size accordingly; this is the *anchor sleeve* of
  the portfolio not a binary.
