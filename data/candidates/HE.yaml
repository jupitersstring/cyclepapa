pre_mortem: |
  It is end-2028 and HE is down 70% from $15 entry.

  Most likely cause: a second Maui-class ignition event occurred before
  the Act 258 forward liability cap was durably tested in court.
  Litigation cascade re-emerged; settlement structure that resolved 2023
  could not be replicated; market re-priced HE for tort uncertainty.
  Equity raise needed at $5 for fresh SPV funding.

  Second-most-likely: Hawaii PUC adopted a more aggressive
  consumer-protection stance, denied rate-base normalisation, and ROE
  realised stuck at 6%. The "50% EPS upside on closing the gap"
  thesis evaporated; multiple compressed back to 1.3× P/B as a
  regulated-utility cyclical without growth.

  Third possibility: Act 258 securitisation faced a constitutional
  challenge; Hawaii Supreme Court struck it down; forward liability
  cap evaporated.

  Where this would show up first: Hawaii PUC docket rulings (rate cases,
  wildfire-mitigation capex recovery); quarterly weather/fire-risk
  meteorological data; legal challenges to Act 258 in Hawaii state
  courts.

