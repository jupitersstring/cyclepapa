  - "Going-concern qualification returns to auditor's report"

pre_mortem: |
  It is mid-2028 and MPVD is down ~70% from entry.

  Most likely cause: NEX orebody grades disappointed. Q1 2027 production
  came in at 0.7 ct/t versus expected 1.2+ ct/t; cash costs ballooned;
  another bridge facility was required and Dunebridge converted debt to
  equity at a punitive ratio that wiped most of the pre-existing public
  float. Diamond cycle had not yet turned.

  Second-most-likely cause: rough price index broke 2024 lows as lab-grown
  supply continued displacing natural diamonds in the 0.5-2ct range and
  Russian sanctions enforcement remained patchy. Even high-grade NEX
  production was uneconomic at realized prices.

  Where this would show up first: quarterly production updates (grade,
  recovered carats per tonne); De Beers JV partner commentary on rough
  pricing in their interim/full-year results.

