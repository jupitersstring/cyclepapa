tier_rationale: |
  PASSED 2026-06-11 after web-research verification.

  What looked like clean "founder-both-sides alignment" (Desmond holding
  both Vertigol >35% equity and Dunebridge bridge debt) has reversed
  into the canonical loan-to-own pattern:

  - Q1 2026: CAD$219k cash vs US$290.6m debt
  - Bridge facility extended six times across 14 months
  - Bridge interest steps from 10.5% → 12.5% on non-repayment
  - Desmond purchased receivables from the company at 17% discount
    (US$999k face for US$833k consideration)
  - May 2026 AGM seeks shareholder approvals to facilitate "potential
    restructuring transaction"
  - Both independent directors (Goracke, Johnson) refused re-election
  - Company announced intent to delist from TSX

  The "founder both sides" structure has become Desmond exercising
  creditor leverage to extract residual value. This is the exact
  failure mode the framework's §2.3 red flags list under "DIP-to-exit
  control transfer." Listed common is heading to zero or
  near-zero. Likely a Bucket C / new-common-only outcome at best.

  Lesson for the framework: "founder-both-sides" is NOT automatically
  3/3 triangulation by construction. When the same party holds both
  tranches, the relevant question is which tranche they have more
  economic value in. Desmond's debt position (par + interest +
  accrued + collateral) materially exceeds his equity position
  (residual claim on a hemorrhaging mining JV). The fulcrum still
  exists — it just sits inside one balance sheet.
