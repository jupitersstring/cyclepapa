tier_rationale: |
  Bucket A, Archetype F+B. Triangulation 3/3 by founder-both-sides
  substitution (Desmond owns both equity and second-lien notes via
  Dunebridge, eliminating fulcrum conflict by construction). C7
  catalyst dated 2026-Q1 to 2027-Q2 (NEX orebody first production).
  No active red flags. No alignment-gap metric available because no
  equity issuance; the economic alignment is on debt-equity ownership
  instead. Small float means re-rating can be violent.

  WARNING: as of 2026-06-04 the deal-term fields are tagged
  `unverified`. Sizing is blocked until the five key numbers are
  cross-checked against the primary filing.
