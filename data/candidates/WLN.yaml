pre_mortem: |
  It is end-2028 and WLN is down 70% from entry around €0.40.

  Most likely cause: the North Star 2030 plan slipped. 2027 FCF was still
  negative due to (a) merchant churn from prior governance/fraud taint
  persisting longer than expected and (b) cost-out programme delivering
  €50-100m less than guided. Anchors did not exit but were unable to
  rebuy at lockup expiry, removing the price-floor narrative. A second
  rights issue at €0.10 was required to fund 2028 maturities.

  Second-most-likely cause: M&A failed to materialise despite repeated
  speculation; payments-sector multiple compression on AI disruption
  thesis (Adyen and Nexi compressed in sympathy) left even successful
  operational delivery uncompetitive on multiple.

  Where this would show up first: half-year cost-out progress vs plan;
  merchant retention disclosure in interim reports.

