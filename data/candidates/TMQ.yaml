pre_mortem: |
  It is end-2027 and TMQ is down 60% from June 2026 entry.

  Most likely cause: Pentagon deal closed but the broader UKMP
  development thesis stalled. Either Ambler road permit denied or
  diluted to seasonal-only access, materially impairing project
  NPV. The 10% Pentagon stake helped capitalise the company through
  the cycle but the underlying asset value didn't rise.

  Second-most-likely cause: Copper cycle deepened on China
  demand weakness; even with Pentagon backing, junior copper
  developers compressed to distress multiples.

  Where this would show up first: BLM record of decision on Ambler
  road; quarterly drill program results.

