tier_rationale: |
  Bucket A, Archetype A2. Triangulation 2.5/3. C7 dated short
  (July 31 closing) but materially weakened by Ambler road
  uncertainty. Pentagon stake at only 10% is materially smaller
  than MP/LAC/UREE.

  Watch for: closing announcement + Ambler ROD. If both come in
  positive in Q3 2026, candidate for Tier 1 promotion.
