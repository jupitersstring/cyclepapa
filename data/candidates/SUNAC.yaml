tier_rationale: |
  Bucket B (new post-MCB common is the trade, not legacy), Archetype F
  (post-bankruptcy/MCB-cascade orphan with founder cap-stack
  participation). Triangulation 2.5/3 with strongest founder alignment
  in the entire Chinese property cascade.

  Tier 2 not Tier 1 because: (a) C7 catalyst is undated by construction
  (depends on Beijing policy stance — that's the H4 weakness applied
  to property); (b) liquidation floor 4-10% means real binary risk;
  (c) Leg 1 valuation is partial — P/B <0.2 implied is extreme but
  warranted by the residual-claim structure, not by an obvious
  multiple gap to comparables.

  Waterfall: bear 40% × 0.30 + base 40% × 2.20 + bull 20% × 5.50 =
  0.12 + 0.88 + 1.10 = 2.10× EV; DD = 0.70 so EV/DD = 3.0. Position
  sizing should be capped at fractional Kelly × strong correlation
  haircut (all four Chinese property names are correlated to a single
  factor: Beijing's property stance).
