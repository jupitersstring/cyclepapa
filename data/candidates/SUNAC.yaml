  - "Sun Hongbin breaks 6-yr lockup (legally precludes normal sale but watch for collateral pledging)"
  - "Onshore creditor rebellion / second onshore restructuring"
  - "PBOC explicitly excludes private developers from any property-support package"
  - "MCB tranche 2 (HK$3.85 strike) becomes deeply in-the-money on stress"

pre_mortem: |
  It is end-2027 and Sunac is down 70% from HK$1.50-1.75 entry.

  Most likely cause: Tier-1 city land sales continued to deteriorate;
  project completions slipped due to working-capital constraints
  (sales receipts coming in below plan); MCB conversion overhang
  pushed equity to HK$0.50; another debt event required. Founder's
  6-yr lock-up prevented him from doubling down but also prevented
  exit, so alignment held but value did not.

  Second-most-likely: a consolidator emerged but at a lowball price
  that triggered the cram-down provisions in the MCB documents;
  minority common holders absorbed disproportionate value transfer.

  Where this would show up first: monthly contracted sales releases
  (Sunac vs Tier-1 city aggregate); CRIC/Centaline monthly land-
  market data; quarterly project-completion status disclosures.

