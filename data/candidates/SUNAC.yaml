  leg2_game_theory: true
  leg3_revealed_pref: true
  notes: |
    Leg 1: P/B <0.2 implied is extreme but warranted given liquidation
    recovery 4-10% per scheme disclosures = surviving equity is
    genuine residual claim not just diluted. Asymmetry is real but
    binary.
    Leg 2: Founder MCB subscription with 6-year lock is the strongest
    founder-alignment signal in the entire Chinese property cascade.
    Cleaner than Kaisa, CIFI, Sino-Ocean on this dimension.
    Leg 3: 23% of new MCBs taken at the same conversion terms as
    creditor-converting holders is itself revealed preference. The 6-yr
    selling restriction is an unusually strong commitment device.

