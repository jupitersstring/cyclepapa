tier_rationale: |
  Bucket A (listed common is the trade), Archetype E (French accelerated
  safeguard) + A1 (Ycor reserved + rights). Triangulation 3/3.

  This is the HIGHEST QUALITATIVE SKEW name in the documented universe.
  Reasons:
  - Hard double-floor: €51.8m net cash + ongoing €60m EBITDA. The
    listed entity cannot durably trade below cash without forced
    liquidation, and operations are profitable so the cash is not
    being burned.
  - Microcap operating leverage: ~€25m market cap vs €60m EBITDA =
    any operational improvement is multi-bagger arithmetic.
  - Anchor execution optionality: Niel (Iliad/Free turnaround template)
    + Lévy (digital-advertising network expertise) = strategic
    optionality on roll-up or sale.
  - Dated catalyst: FY2027 plan targets.

  Tier 1 not Tier 2 because the structural skew supports core sizing
  *if* the illiquidity constraint can be managed. For institutional
  sizing this is a microcap exposure constraint; for a smaller book
  it is the cleanest asymmetric setup in the basket.

  Source tags are 'reported' not 'verified' — primary safeguard
  documents and FY2025 audited accounts need verification before
  full sizing. Diagnostic warning will surface this in the screen.
