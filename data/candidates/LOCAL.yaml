pre_mortem: |
  It is end-2028 and LOCAL is down 70% from current ~€0.07-0.08
  microcap level.

  Most likely cause: digital advertising for local businesses
  continued to bleed to Google/Meta/Amazon; €60m EBITDA proved
  fragile and shrank to €25-30m; FY27 targets missed by 50%+. Net
  cash burned down to €15-20m. Ycor did not execute a digital-
  network roll-up; the strategic-anchor optionality didn't fire.

  Second-most-likely: Ycor decided to take the company private at a
  modest premium to current; minority public squeezed out at a
  fairness-opinion price below intrinsic value. The skew analysis
  was right but the buyer didn't get to participate.

  Where this would show up first: H1 2026 revenue print (off
  trajectory by 5%+ = warning); EBITDA margin print; Niel or Lévy
  M&A activity outside Solocal context.

