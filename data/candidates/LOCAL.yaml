triangulation:
  leg1_valuation: true
  leg2_game_theory: true
  leg3_revealed_pref: true
  notes: |
    Leg 1: €60m EBITDA at ~€20-30m market cap = trades <0.5x EV/EBITDA
    vs French digital-advertising peers 4-6x EV/EBITDA. Pure gap-closure
    arithmetic supports 3-5x re-rate without any operational improvement.
    Leg 2: Ycor 64.8% control = total alignment by construction;
    legacy public 0.4% is structurally irrelevant; no creditor overhang
    (€51.8m net cash means no debt-equity conflict).
    Leg 3: Lévy and Niel personally took control at €0.003/share via
    Ycor — they are not absentee anchors. Niel's track record at Iliad
    is the operational template (microcap → multibagger via aggressive
    strategic action). Revealed preference is the act of acquiring
    control, not a transaction price.

