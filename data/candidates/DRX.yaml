kill_criteria:
  - "BECCS framework explicitly excludes Drax Power Station from cluster designation"
  - "Treasury announces Track-1 capex package below £1bn total"
  - "Bridging Mechanism not extended past 2027 July cliff date"
  - "Drax CEO Bashir or chair resigns prior to framework signing"
  - "UK general election produces government that abandons CCS programme"

pre_mortem: |
  It is end-2027 and DRX is down 60% from current ~£5-6.

  Most likely cause: BECCS framework either signed at materially less
  generous economics than the bull case implies, or signed late
  enough that the 2027 subsidy cliff bit before transition revenue
  arrived. The Bridging Mechanism was extended but at lower per-MWh
  rates that compressed the implied negative-emissions strike price.
  Multiple did not re-rate because the market read the framework as
  "biomass utility with extra optionality" not "negative-emissions
  utility."

  Second-most-likely cause: UK Treasury cluster sequencing slipped
  Drax to Track-2 or later in a fiscal review; East Coast cluster
  partnership with British Steel / partners did not materialise;
  Drax announced an equity raise to fund Track-2 transition capex
  with reduced government underwrite.

  Third possibility: A general election produced a new government
  hostile to CCS or to biomass; framework was scrapped; Drax's
  market cap retraced to pure biomass-cliff terminal value.

  Where this would show up first: DESNZ quarterly cluster updates;
  Treasury budget cycle communications on CCS; Drax interim trading
  statements on Bridging Mechanism economics.

