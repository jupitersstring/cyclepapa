tier_rationale: |
  Bucket A (listed common is the trade), Archetype A1 (sovereign
  anchor in contract-form via DESNZ) + G (regulator-mandate forcing
  business-model pivot). Triangulation 2.5/3 (Leg 3 partial pending
  insider activity verification at Drax through 2025-2026).

  Tier 2 not Tier 1 because:
  (a) the anchor commitment is *negotiated, not yet executed* —
      Bridging Mechanism HoT signed February 2025 but full framework
      pending H2 2026 to H1 2027
  (b) the deal is structurally pre-execution; this is exactly the
      'early' position that gives more asymmetric upside than a
      post-deal compounder like Metro Bank
  (c) the kill case is real — ROC subsidy cliff July 2027 means
      framework must be signed by then with operative bridging in
      between

  Risk/reward vs Metro Bank: Metro has ~2:1 upside/downside on
  multiple normalisation alone. DRX has 3-5:1 on pre-execution
  BECCS framework binary with bridging mechanism partial floor.
  The 'early' attribute the user asked for is the pre-execution
  status of the sovereign anchor — buying ahead of the floor's
  formal commitment rather than after it.

  Position note: catalyst clock is tight (H2 2026 to H1 2027
  framework window). Anchor-stage names like this are most
  asymmetric pre-commit; if framework is signed, immediate
  re-rate; if framework slips, drawdown begins as the cliff
  approaches. Sizing should reflect the binary plus the bridging
  partial floor.
