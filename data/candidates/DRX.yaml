triangulation:
  leg1_valuation: true
  leg2_game_theory: true
  leg3_revealed_pref: partial
  notes: |
    Leg 1: ~5× FY24 EBITDA against UK utility peers 9-11× and global
    renewables 12-15× = significant gap-closure available IF BECCS
    framework lands. Pure cliff scenario already mostly priced (stock
    drawdown from 2023 highs).
    Leg 2: UK Treasury cannot let Track-1 cluster fail without
    abandoning the entire CCS programme; political cost of denying
    Drax materially exceeds the cost of commercial framework support.
    Drax is structurally first-mover with operational biomass + CCS
    R&D — competitors are years behind.
    Leg 3: PARTIAL — Bridging Mechanism heads of terms signed
    February 2025 = early commitment signal but full framework not
    yet executed. UK government has not (yet) taken equity. Insider
    buying record at Drax should be checked for confirmation.

