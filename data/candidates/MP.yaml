tier_rationale: |
  Bucket A, Archetype A2 (the template deal for the entire critical-
  minerals sovereign cluster). Triangulation 3/3 with DoD acting as
  shareholder + lender + offtake + price-floor counterparty
  simultaneously. C7 dated within 24 months (Stillwater commercial
  ramp 2026-Q4 to 2027-Q4).

  Already partially re-rated (5× since 2024 base). The new question
  the framework asks: is the premium-to-peers multiple fully pricing
  the DoD floor advantage? Waterfall says no — base 1.80×, bull
  3.20×. EV 2.04× / DD 0.45 = EV/DD 4.5.

  This is the cluster ANCHOR — not the highest EV (LAC is higher) but
  the highest *information density* because every other A2 candidate
  (UREE, Trilogy, Lynas, Algoma, Calumet, Atlantic Alumina) is
  trading on a structural analogy to this deal.
