pre_mortem: |
  It is end-2028 and MP is down 70% from current.

  Most likely cause: magnet plant ramp slipped 18+ months due to
  process engineering complexity (yield rates below pilot, recovery
  losses, downstream contamination). Meanwhile, China's NdPr export
  controls relaxed under a Phase 1-style trade deal; NdPr spot
  collapsed to $50; DoD floor protected revenue floor but margin
  compression came from operating-cost overruns. Multiple compressed
  from premium-priced sovereign-anchored to fair-priced REE miner.

  Second-most-likely: post-2028 administration repurposed DoD
  critical-minerals priorities; preferred + warrants restructured at
  punitive terms; equity diluted further.

  Where this would show up first: 10-Q quarterly Stillwater commercial
  production milestones; Chinese MOFCOM export-licensing announcements;
  quarterly average NdPr realised price vs floor.

