  - "Spanish recession deepens; CRE losses materialise"
  - "Spanish Govt forces a punitive resolution on BBVA terms"

pre_mortem: |
  It is end-2027 and SAB is down 50pct from current.

  Most likely: BBVA withdrew but standalone plan missed target
  ROTE; Spanish CRE cycle compressed mortgage book; multiple
  reverted to 0.6x TBV.

