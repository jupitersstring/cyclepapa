    window: [2026-06-01, 2027-12-31]
    p_favorable: 0.55
    rerate_if_yes: [1.3, 1.7]
    hit_if_no: [-0.10, -0.20]
    source: "management plan"

waterfall:
  bear: {p: 0.20, return_multiple: 0.75, rationale: "BBVA bid revised down on Spanish-Govt conditions; minority squeeze concerns; standalone narrative dilutes"}
  base: {p: 0.55, return_multiple: 1.65, rationale: "BBVA withdraws or accepts at modestly improved terms; special dividend distributed; multiple normalises post-uncertainty"}
  bull: {p: 0.25, return_multiple: 2.40, rationale: "BBVA accepts and bumps materially; or BBVA withdraws and standalone plan delivers 20pct ROTE + sector M&A consolidation"}

anchor:
  parties: ["BBVA (bidder/strategic anchor)", "Spanish Government (competition gatekeeper)"]
  pricing:
    reserved_price: 2.13
    current_price: null
    currency: EUR

triangulation:
  leg1_valuation: true
  leg2_game_theory: true
  leg3_revealed_pref: true
  notes: |
    Leg 1: TSB sale crystallises hidden-asset value; standalone
    multiple post-distribution attractive vs European bank peers.
    Leg 2: BBVA forced to either accept Spanish Govt conditions
    and bump, or withdraw — both outcomes positive for SAB.
    Leg 3: BBVA bid itself = revealed-preference floor at ~€2.13
    (initial); TSB sale to Santander = strategic-buyer interest
    floor on TSB asset.

