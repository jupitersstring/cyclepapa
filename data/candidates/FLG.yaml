pre_mortem: |
  It is end-2027 and FLG is down 60pct from current.

  Most likely: CRE workout took longer than expected; Manhattan
  rent-stabilised re-financings flooded the market; multiple
  charge-off waves required another raise at $5; Mnuchin diluted
  but stayed. Compounded by Mortgage-Banking margin compression
  from rate volatility.

  Second most likely: OCC consent order escalated to formal
  enforcement; regulatory capital remediation cost exceeded
  reserves; further dilution.

