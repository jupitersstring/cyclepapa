kill_criteria:
  - "CHIPS Act loan covenant breach during Round Top construction"
  - "Round Top first production pushed past mid-2029"
  - "China NdPr export controls comprehensively relaxed"
  - "US Gov reduces equity stake below 5% or sells warrants"
  - "Equity raise needed before first commercial magnet production"

pre_mortem: |
  It is end-2029 and UREE is down 70% from June 2026 entry.

  Most likely cause: Round Top construction delays + cost overruns
  similar to LAC Phase 1 history. CHIPS Act covenant trip forces
  renegotiation; warrants accelerated; further dilutive equity raise
  at depressed prices.

  Second-most-likely cause: NdPr cycle broke — China relaxed
  export controls under bilateral trade arrangement, magnet pricing
  fell below the implicit DoD floor framework. Even with sub-
  commercial financing, ramp economics were uncompetitive.

  Third possibility: new administration repurposes critical-
  minerals industrial policy framework, US Gov stake terms
  re-cut, equity holders absorb the value transfer.

  Where this would show up first: quarterly cost-to-complete updates
  in 10-Q; China rare-earth export licensing announcements; CHIPS
  policy guidance shifts.

