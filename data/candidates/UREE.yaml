  leg3_revealed_pref: true
  notes: |
    Leg 1: $3.5bn total committed capital with US Gov sub-commercial
    senior secured financing capacity ($1.3bn CHIPS Act). NPV of
    sub-commercial financing materially below market cap.
    Leg 2: US Gov as both equity holder (10%/16% diluted) and
    senior secured lender = strongest possible alignment along the
    cap stack. No fee-extractive features; warrants struck in
    structure typical of MP Materials template.
    Leg 3: $1.5bn private capital raise completed Jan 2026 prior to
    federal finalization = revealed-preference signal from private
    capital that the federal terms would close. Stock +21% on LOI
    announcement Feb 2026, +21% again on definitive June 3, 2026 =
    market progressively validating thesis.

