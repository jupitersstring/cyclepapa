tier_rationale: |
  Bucket A, Archetype A2 (sovereign industrial-policy anchor — the
  third template-defining example after MP Materials and Lithium
  Americas). Triangulation 3/3. C7 catalysts dated (Stillwater
  magnet commissioning 2026-2027; Round Top production 2027-2028).
  No active red flags; one watch flag on policy continuity.

  $3.5bn total committed capital relative to market cap implies
  sub-commercial financing arbitrage embedded in equity not yet
  fully reflected. The Stillwater facility ramp is the dated
  near-term inflection — 2-3 quarters away — that distinguishes
  UREE from LAC (which is 5-6 quarters out).

  This is now the canonical "Tier 1 new entrant" of the May 2026
  cohort.
