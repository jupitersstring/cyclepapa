tier_rationale: |
  Bucket A, Archetype A2 (sovereign industrial-policy anchor — the
  template-defining example alongside MP Materials). Triangulation 3/3.
  C7 dated 2027-Q4 to 2028 (Phase 1 mechanical completion + first
  commercial production). No active red flags; one watch flag on DOE
  policy under new administration. Sub-commercial 24-year 0%-spread
  financing is the unique structural feature — embedded NPV of the
  financing alone is material vs current market cap.

  WARNING: deal-term fields unverified pending cross-check with DOE
  conditional commitment letter and company 10-K. Sizing blocked at
  full conviction until verified.
