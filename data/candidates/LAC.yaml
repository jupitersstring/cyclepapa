  - "Equity raise needed before first commercial production"

pre_mortem: |
  It is mid-2029 and LAC is down 70% from entry.

  Most likely cause: lithium cycle did not recover; carbonate prices stayed
  below $10k/t through start-up despite EV market recovery, because Chinese
  lepidolite supply continued to flood. Even with sub-commercial DOE
  financing, ramp economics were uneconomic at spot, requiring additional
  equity that diluted heavily.

  Second-most-likely cause: DOE ATVM covenants tripped during construction
  (delays + cost overruns), forcing renegotiation under a less-friendly
  administration. Warrants accelerated, equity diluted, and the
  sub-commercial spread advantage was clawed back.

  Where this would show up first: quarterly lithium spot prices vs
  break-even disclosed in earnings; cost-to-complete updates in 10-Q;
  CHIPS/DOE policy guidance under new administration.

