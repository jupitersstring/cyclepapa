  base: {p: 0.55, return_multiple: 1.80, rationale: "RIGI framework holds; Vaca Muerta production on track; multiple normalises to 4-5x EV/EBITDA; broker target $68"}
  bull: {p: 0.25, return_multiple: 3.20, rationale: "Argentina re-rates to mid-cycle EM oil multiple (5-6x); Vaca Muerta production exceeds target; LNG export project advances"}

anchor:
  parties: ["Republic of Argentina (51pct via state holding)", "Milei administration RIGI framework"]
  pricing:
    current_price: 41
    currency: USD
  stake_pct: 51
  holds_debt: false
  holds_equity: true

triangulation:
  leg1_valuation: true
  leg2_game_theory: true
  leg3_revealed_pref: true
  notes: |
    Leg 1: 4.14x EV/EBITDA 2026 vs EM oil peer mid-cycle 6-7x =
    clear gap.
    Leg 2: Milei + Caputo + Sturzenegger all aligned on RIGI
    framework as Argentine sovereign anchor.
    Leg 3: Pluspetrol asset swap January 2026 = revealed preference
    that YPF is being consolidated as the platform; TGS+Chevron
    $3bn consortium = follow-on private capital alignment.

