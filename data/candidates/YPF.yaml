kill_criteria:
  - "Milei loses October 2027 midterms; RIGI rolled back"
  - "Vaca Muerta production materially slips (>20pct vs target)"
  - "Chevron / Repsol litigation revives"
  - "Argentine sovereign default forces YPF debt restructure"

pre_mortem: |
  It is end-2027 and YPF is down 60pct from current ~$41.

  Most likely: Milei lost October 2027 midterms, succeeding
  administration constrained RIGI framework; Vaca Muerta IRR
  compressed; multiple back to crisis-era 3x EV/EBITDA.

  Second most likely: Chevron settlement revived ($16bn historic
  judgment); equity dilution required.

history:
  - {date: 2026-01-22, event: "Pluspetrol share-swap consolidating YPF to 100pct in certain areas", state_after: watch}
  - {date: 2026-03-15, event: "Milei RIGI expanded to unconventional oil", state_after: option}
  - {date: 2026-06-18, event: "YAML built; universe-screener score 1.12", state_after: option}

factors:
  primary: policy
  exposures: ["Argentine sovereign risk", "Vaca Muerta production", "Milei midterm policy continuity", "EM oil multiple"]

tier_rationale: |
  Bucket A, Archetype A1 (Argentine sovereign anchor via RIGI) +
  G (regulatory-mandate framework). Universe-screen score 1.12 =
  2nd-highest in 697-name universe. National-service-risk dim 18 =
  1 (Milei-era; would be 0 under prior administrations) keeps
  Tier 2 not Tier 1.
