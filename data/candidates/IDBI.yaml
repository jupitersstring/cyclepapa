  - "Deal pushed past the 2027 calendar without signed SPA"

pre_mortem: |
  It is end-2027 and IDBI has round-tripped -30% from entry.

  Most likely cause: the valuation-gap standoff never resolved. The
  Centre declined to cut the reserve (politically unsellable to be seen
  selling a recovering bank 'cheap'), Fairfax walked, and the sale was
  quietly deferred past the next election cycle. The privatization
  premium in the price unwound, and IDBI re-traded as a mid-tier PSB
  on sector multiples through a softening credit cycle.

  Second-most-likely: the deal closed but the open-offer mechanics and
  post-deal integration disappointed — control transferred at the
  cut reserve with minorities excluded from the control premium.

  Where this would show up first: DIPAM ministerial statements; Fairfax
  quarterly letters; reserve-price decision leaks in Business Standard /
  Mint.

