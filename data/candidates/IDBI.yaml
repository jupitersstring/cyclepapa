triangulation:
  leg1_valuation: partial
  leg2_game_theory: true
  leg3_revealed_pref: true
  notes: |
    Leg 1: Partial — IDBI already re-rated through the 2022-24 PSU cycle;
    the residual discount is the governance/control discount, not a
    solvency discount. Upside is to private-bank multiples, not from
    distress.
    Leg 2: GoI+LIC are non-economic sellers with a published intent to
    exit control; the buyer set is strategic, not loan-to-own.
    Leg 3: Three sophisticated bidders revealed a price floor of
    ₹40,000-45,000 cr in February 2026. That bid tape is the
    revealed-preference datum: the market-clearing control value is
    known even while the deal stalls.

