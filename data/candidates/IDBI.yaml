tier_rationale: |
  Bucket A, Archetype H1 (strategic privatization). The cleanest dated
  governance binary in the live universe: the bid tape exists
  (₹40-45k cr), the seller's decision (cut reserve up to 20%) is
  actively under consideration, and the buyer (Fairfax) has executed
  the exact playbook before at CSB Bank.

  Tier 2 not Tier 1 because: (a) the catalyst probability is genuinely
  uncertain (~45% on the revival decision — the state has stalled this
  sale since 2022); (b) Leg 1 is partial — the easy solvency re-rate
  already happened in 2022-24; what remains is the control-premium /
  governance re-rate; (c) waterfall EV ~1.66x is below the Tier 1 EV
  bar. Promote on a signed SPA or formal reserve-cut announcement.

  Position note: the H1 trade is convex to the *decision*, not the
  completion — most of the re-rate historically happens between
  announcement of accepted bid and completion.
