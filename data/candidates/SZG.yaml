    Leg 1: Trades 0.6× book despite Aurubis stake worth €400-500m
    plus SALCOS €1bn state-aid commitment plus pumped pre-FY26 EBITDA
    trough. Mid-cycle EBITDA historical €700m-1bn vs current €60m =
    operational leverage on cycle reversion.
    Leg 2: EU IAA explicitly designates steel + aluminium + cement as
    Title III priorities. KfW has institutional mandate to finance
    Energiewende; SALCOS is the marquee German project. Game-theoretic
    alignment is structural.
    Leg 3: PARTIAL — €1bn state aid already approved (revealed
    preference at the EU Commission level) but no KfW equity-form
    anchor yet committed. Founder/promoter equity-form anchoring is
    absent (SZG is widely held without dominant shareholder).

