pre_mortem: |
  It is end-2028 and SZG is down 60% from current ~€18-20 (price).

  Most likely cause: SALCOS Phase 1 slipped to 2028 due to hydrogen
  supply issues; KfW declined to commit second tranche on grounds of
  EU Commission fiscal scrutiny; steel cycle deepened further on
  Chinese over-supply; multiple compressed from 0.6× book to 0.3×
  book.

  Second-most-likely: SALCOS Phase 1 hit milestone but unit
  economics were uncompetitive vs grey-steel competitors who
  refused to pay green-steel premium; offtake commitments
  evaporated.

  Third possibility: Aurubis stake disposed in distressed sale to
  fund SALCOS over-runs.

  Where this would show up first: SALCOS programme quarterly
  updates; CBAM enforcement statistics; Chinese steel-export
  statistics; Aurubis stake actions in quarterly disclosures.

