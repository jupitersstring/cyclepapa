tier_rationale: |
  Bucket A (listed common is the trade), Archetype A2 (post-IAA
  sovereign industrial policy) + B (cyclical steel cycle inflection).
  Triangulation 2.5/3 (Leg 3 partial — €1bn state aid is revealed
  preference but KfW equity-form anchor not yet committed).

  Tier 2 not Tier 1 because:
  (a) anchor is *pre-commit* (€1bn already; KfW second tranche TBD)
  (b) cycle leg is supportive but not necessary (works as A2-only
      if KfW commits even without full cycle inflection)
  (c) hidden-asset Aurubis floor (€400-500m vs €1.4bn cap = 28-35%
      of market cap is the Aurubis stake alone)

  Risk/reward vs Metro Bank: 3-4:1 vs 2:1. Earlier than Metro
  because the KfW anchor commitment is not yet placed — buyer is
  ahead of the anchor's formal price-setting.

  This is the European equivalent of DRX: pre-anchor sovereign-
  industrial-policy candidate with a dated framework decision
  ahead and a partial floor (€1bn EU state aid + Aurubis stake)
  even in the bear scenario.

  Sizing: smaller than core picks because the anchor commit is the
  binary; size higher post-KfW-commit announcement when the binary
  resolves favourably.
