name: Ord Scanner (SP500 W/M)

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to scan"
        type: choice
        default: both
        options: [W, M, both]
      top:
        description: "Top N to display per timeframe"
        default: "30"
      min_score:
        description: "Minimum composite score to include"
        default: "4"
  schedule:
    # Sunday 23:00 UTC -- after US market close, before Monday open
    - cron: "0 23 * * 0"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" "pandas>=2.0" "numpy>=1.24" "lxml>=4.9" "requests>=2.31"

      - name: Run scanner
        env:
          TIMEFRAME: ${{ github.event.inputs.timeframe || 'both' }}
          TOP:       ${{ github.event.inputs.top || '30' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '4' }}
        run: |
          mkdir -p scan_out
          python ord_scanner.py \
            --tf "$TIMEFRAME" \
            --top "$TOP" \
            --min-score "$MIN_SCORE" \
            --out-dir scan_out | tee scan_out/scan_report.txt

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ord-scan-${{ github.run_id }}
          path: scan_out/
          retention-days: 30

      - name: Append summary
        if: always()
        run: |
          {
            echo "## Ord Scanner Results"
            echo ""
            echo "Timeframe: \`${TIMEFRAME:-both}\`"
            echo ""
            if [ -f scan_out/scan_report.txt ]; then
              echo '```'
              cat scan_out/scan_report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
