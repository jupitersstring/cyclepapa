name: Ord Scanner (SP500 W/M)

on:
  push:
    branches:
      - "claude/ord-price-volume-system-**"
    paths:
      - "ord_scanner.py"
      - "cross_rank.py"
      - ".github/workflows/ord-scanner.yml"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to scan"
        type: choice
        default: both
        options: [W, M, both]
      top:
        description: "Top N to display per timeframe"
        default: "30"
  schedule:
    - cron: "0 23 * * 0"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" "pandas>=2.0" "numpy>=1.24" "lxml>=4.9" "requests>=2.31"

      - name: Scan SP500
        run: |
          mkdir -p results
          TF="${{ github.event.inputs.timeframe || 'both' }}"
          TOP="${{ github.event.inputs.top || '30' }}"
          python ord_scanner.py --tf "$TF" --top "$TOP" --min-score 0 \
            --mode early --universe sp500 --out-dir results 2>&1 | tee results/scan_report.txt

      - name: Scan SMID
        run: |
          TF="${{ github.event.inputs.timeframe || 'both' }}"
          TOP="${{ github.event.inputs.top || '30' }}"
          python ord_scanner.py --tf "$TF" --top "$TOP" --min-score 0 \
            --mode early --universe smid --out-dir results 2>&1 | tee -a results/scan_report.txt

      - name: Cross-rank all results
        run: |
          python cross_rank.py --top 50 --min-ua 30 --out results/ultimate_asymmetry.csv 2>&1 | tee -a results/scan_report.txt

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ord-scan-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Append summary
        if: always()
        run: |
          {
            echo "## Ord Scanner Results"
            echo ""
            if [ -f results/scan_report.txt ]; then
              echo '```'
              head -500 results/scan_report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results back to branch
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/
          if git diff --cached --quiet; then
            echo "no result changes to commit"
            exit 0
          fi
          git commit -m "ci: scanner results for run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
