name: Scrape listed-equity birthdays

on:
  workflow_dispatch:
  push:
    branches:
      - claude/scrape-wikidata-birthdays-39uOY
    paths:
      - scrape_wikidata_birthdays.py
      - .github/workflows/scrape_birthdays.yml

permissions:
  contents: write

# Only one scrape run at a time on this branch — otherwise concurrent runs
# race on data/ and on the rebase-then-push step.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run scraper
        run: python3 scrape_wikidata_birthdays.py

      - name: Summarize
        if: always()
        run: |
          if [ -d data ]; then
            wc -l data/*.csv 2>/dev/null || true
          fi

      - name: Upload per-exchange CSVs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listed_equity_birthdays_per_exchange
          path: data/*.csv
          if-no-files-found: warn

      - name: Commit results back to branch
        if: always() && hashFiles('data/*.csv') != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add data/
          # Drop the old monolithic CSV now that we output per-exchange files.
          git rm -f listed_equity_birthdays.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update per-exchange birthday datasets"
          git push origin HEAD:${GITHUB_REF_NAME}
